name: Check branch commit

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  isort:
    uses: ./.github/workflows/isort.yml
  black:
    uses: ./.github/workflows/black.yml
  build:
    uses: ./.github/workflows/integration.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  docs:
    uses: ./.github/workflows/docs.yml
