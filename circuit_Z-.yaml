name: DBBS Mouse cerebellum configuration v4.2 (Z- Purkinje Cells)
storage:
  engine: hdf5
  root: mouse_cerebellum.hdf5
network:
  chunk_size:
  - 100.0
  - 100.0
  - 100.0
  x: 300.0
  y: 200.0
  z: 295.0
components:
- module: cerebellar_models/nest_models/build_models.py
morphologies:
- file: ./morphologies/GranuleCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - axon
      - axon_hillock
      '17':
      - axon
      - axon_initial_segment
      '18':
      - axon
      - ascending_axon
      '19':
      - axon
      - parallel_fiber
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- file: ./morphologies/GolgiCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - dendrites
      - basal_dendrites
      '17':
      - dendrites
      - apical_dendrites
      '18':
      - axon
      - axon_initial_segment
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- file: ./morphologies/PurkinjeCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - axon
      - AIS
      '17':
      - axon
      - AIS_K
      '18':
      - axon
      - axonmyelin
      '19':
      - axon
      - nodes
      '20':
      - dendrites
      - basal
      '21':
      - dendrites
      - pf_targets
      - sc_targets
      '22':
      - dendrites
      - aa_targets
      - sc_targets
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- file: ./morphologies/StellateCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - dendrites
      - proximal_dendrites
      '17':
      - dendrites
      - distal_dendrites
      '18':
      - axon
      - axon_initial_segment
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- file: ./morphologies/BasketCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - axon
      - axon_initial_segment
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
regions:
  cerebellar_cortex:
    children:
    - granular_layer
    - purkinje_layer
    - b_molecular_layer
    - t_molecular_layer
    type: stack
partitions:
  granular_layer:
    thickness: 130.0
  purkinje_layer:
    thickness: 15.0
  b_molecular_layer:
    thickness: 50.0
  t_molecular_layer:
    thickness: 100.0
cell_types:
  glomerulus:
    plotting:
      display_name: Glomerulus
    spatial:
      density: 0.0003
      radius: 1.5
  mossy_fibers:
    spatial:
      count_ratio: 0.05
      radius: 1.0
      relative_to: glomerulus
  granule_cell:
    plotting:
      display_name: Granule cell
      opacity: 0.3
    spatial:
      density: 0.0039
      morphologies:
      - GranuleCell
      radius: 2.5
  golgi_cell:
    plotting:
      display_name: Golgi cell
    spatial:
      density: 9.0e-06
      morphologies:
      - GolgiCell
      radius: 8.0
  purkinje_cell:
    plotting:
      display_name: Purkinje cell
    spatial:
      morphologies:
      - PurkinjeCell
      planar_density: 0.001166
      radius: 7.5
  basket_cell:
    plotting:
      display_name: Basket cell
    spatial:
      density: 5.0e-05
      morphologies:
      - BasketCell
      radius: 6.0
  stellate_cell:
    plotting:
      display_name: Stellate cell
    spatial:
      density: 5.0e-05
      morphologies:
      - StellateCell
      radius: 4.0
placement:
  granular_layer_innervation:
    cell_types:
    - mossy_fibers
    partitions:
    - granular_layer
    strategy: bsb.placement.RandomPlacement
  granular_layer_placement:
    cell_types:
    - granule_cell
    - golgi_cell
    - glomerulus
    partitions:
    - granular_layer
    strategy: bsb.placement.RandomPlacement
  purkinje_layer_placement:
    angle: 80.0
    cell_types:
    - purkinje_cell
    partitions:
    - purkinje_layer
    spacing_x: 130.0
    strategy: bsb.placement.ParallelArrayPlacement
  basket_layer_placement:
    cell_types:
    - basket_cell
    partitions:
    - b_molecular_layer
    strategy: bsb.placement.RandomPlacement
  stellate_layer_placement:
    cell_types:
    - stellate_cell
    partitions:
    - t_molecular_layer
    strategy: bsb.placement.RandomPlacement
connectivity:
  mossy_fibers_to_glomerulus:
    postsynaptic:
      cell_types:
      - glomerulus
    presynaptic:
      cell_types:
      - mossy_fibers
    strategy: cerebellar_models.connectome.to_glomerulus.ConnectomeMossyGlomerulus
    x_length: 60.0
    y_length: 20.0
  glomerulus_to_granule:
    convergence: 4.0
    postsynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - dendrites
    pre_cell_types:
    - mossy_fibers
    pre_glom_strats:
    - mossy_fibers_to_glomerulus
    presynaptic:
      cell_types:
      - glomerulus
    radius: 40
    strategy: cerebellar_models.connectome.glomerulus_granule.ConnectomeGlomerulusGranule
  glomerulus_to_golgi:
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - glomerulus
    radius: 50
    strategy: cerebellar_models.connectome.glomerulus_golgi.ConnectomeGlomerulusGolgi
  golgi_to_glomerulus:
    divergence: 40.0
    glom_cell_types:
    - glomerulus
    glom_post_strats:
    - glomerulus_to_granule
    postsynaptic:
      cell_types:
      - granule_cell
    presynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - axon
    radius: 150.0
    strategy: cerebellar_models.connectome.golgi_glomerulus.ConnectomeGolgiGlomerulus
  gap_goc:
    affinity: 0.3
    contacts:
      distribution: norm
      loc: 3
      scale: 1
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  golgi_to_golgi:
    affinity: 0.5
    contacts:
      distribution: norm
      loc: 160
      scale: 5
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  ascending_axon_to_golgi:
    affinity: 0.05
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - ascending_axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  parallel_fiber_to_golgi:
    affinity: 0.08
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - apical_dendrites
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - parallel_fiber
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  ascending_axon_to_purkinje:
    affinity: 0.05
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - aa_targets
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - ascending_axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  parallel_fiber_to_purkinje:
    affinity: 0.1
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - pf_targets
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - parallel_fiber
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  parallel_fiber_to_basket:
    affinity: 0.08
    postsynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - dendrites
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - parallel_fiber
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  parallel_fiber_to_stellate:
    affinity: 0.08
    postsynaptic:
      cell_types:
      - stellate_cell
      morphology_labels:
      - dendrites
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - parallel_fiber
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  basket_to_purkinje:
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - soma
    presynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  stellate_to_purkinje:
    affinity: 0.1
    contacts:
      distribution: norm
      loc: 10
      scale: 0.3
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - sc_targets
    presynaptic:
      cell_types:
      - stellate_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  basket_to_basket:
    affinity: 0.5
    contacts:
      distribution: norm
      loc: 100
      scale: 4
    postsynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - dendrites
    presynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  stellate_to_stellate:
    affinity: 0.3
    contacts:
      distribution: norm
      loc: 100
      scale: 4
    postsynaptic:
      cell_types:
      - stellate_cell
      morphology_labels:
      - dendrites
    presynaptic:
      cell_types:
      - stellate_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
after_connectivity:
  print_structure_report:
    output_filename: bsb_report_structure.pdf
    strategy: cerebellar_models.analysis.structure_analysis.RunStructureReport
simulations:
  nest_basal_activity:
    simulator: nest
    modules:
    - cerebmodule
    duration: 5000.0
    resolution: 0.1
    seed: 1234
    cell_models:
      mossy_fibers:
        model: parrot_neuron
      glomerulus:
        model: parrot_neuron
      granule_cell:
        constants:
          A1: 0.01
          A2: -0.94
          C_m: 7
          E_L: -62
          E_rev1: 0
          E_rev2: -80
          I_e: -0.888
          V_m: -62.0
          V_min: -150
          V_reset: -70
          V_th: -41
          k_1: 0.311
          k_2: 0.041407868
          k_adap: 0.022
          lambda_0: 1.0
          t_ref: 1.5
          tau_V: 0.3
          tau_m: 24.15
          tau_syn1: 5.8
          tau_syn2: 13.61
        model: eglif_cond_alpha_multisyn
      golgi_cell:
        constants:
          A1: 259.988
          A2: 178.01
          C_m: 145
          E_L: -62
          E_rev1: 0
          E_rev2: -80
          E_rev3: 0
          I_e: 16.214
          V_m: -60.0
          V_min: -150
          V_reset: -75
          V_th: -55
          k_1: 0.031
          k_2: 0.023
          k_adap: 0.217
          lambda_0: 0.15
          t_ref: 2
          tau_V: 0.09
          tau_m: 44
          tau_syn1: 0.23
          tau_syn2: 10
          tau_syn3: 0.5
        model: eglif_cond_alpha_multisyn
      purkinje_cell:
        constants:
          t_ref: 0.5
          V_min: -350
          C_m: 334
          V_th: -43
          V_reset: -69
          E_L: -59
          V_m: -59.0
          lambda_0: 4.
          tau_V: 3.5
          tau_m: 47
          I_e: 700.
          k_adap: 1.491
          k_1: 0.195
          k_2: 0.041
          A1: 157.622
          A2: 172.622
          tau_syn1: 1.1
          tau_syn2: 2.8
          tau_syn3: 0.4
          E_rev1: 0
          E_rev2: -80
          E_rev3: 0
        model: eglif_cond_alpha_multisyn
      basket_cell:
        constants:
          A1: 5.953
          A2: 5.863
          C_m: 14.6
          E_L: -68
          E_rev1: 0
          E_rev2: -80
          E_rev3: 0
          I_e: 3.711
          V_m: -60.0
          V_reset: -78
          V_th: -53
          k_1: 1.887
          k_2: 1.096
          k_adap: 2.025
          lambda_0: 1.8
          t_ref: 1.59
          tau_V: 1.0
          tau_m: 9.125
          tau_syn1: 0.64
          tau_syn2: 2
          tau_syn3: 1.2
        model: eglif_cond_alpha_multisyn
      stellate_cell:
        constants:
          A1: 5.953
          A2: 5.863
          C_m: 14.6
          E_L: -68
          E_rev1: 0
          E_rev2: -80
          E_rev3: 0
          I_e: 3.711
          V_m: -60.0
          V_reset: -78
          V_th: -53
          k_1: 1.887
          k_2: 1.096
          k_adap: 2.025
          lambda_0: 1.8
          t_ref: 1.59
          tau_V: 1
          tau_m: 9.125
          tau_syn1: 0.64
          tau_syn2: 2
          tau_syn3: 1.2
        model: eglif_cond_alpha_multisyn
    connection_models:
      mossy_fibers_to_glomerulus:
        synapses:
        - delay: 1.0
          model: static_synapse
          weight: 1.0
      glomerulus_to_granule:
        synapses:
        - delay: 1.0
          model: static_synapse
          receptor_type: 1
          weight: 0.23
      glomerulus_to_golgi:
        synapses:
        - delay: 1.0
          model: static_synapse
          receptor_type: 1
          weight: 0.24
      golgi_to_glomerulus:
        synapses:
        - delay: 2.0
          model: static_synapse
          receptor_type: 2
          weight: 0.24
      golgi_to_golgi:
        synapses:
        - delay: 4.0
          model: static_synapse
          receptor_type: 2
          weight: 0.007
      ascending_axon_to_golgi:
        synapses:
        - delay: 2.0
          model: static_synapse
          receptor_type: 3
          weight: 0.82
      parallel_fiber_to_golgi:
        synapses:
        - delay: 5.0
          model: static_synapse
          receptor_type: 3
          weight: 0.05
      ascending_axon_to_purkinje:
        synapses:
        - delay: 2.0
          model: static_synapse
          receptor_type: 1
          weight: 0.41
      parallel_fiber_to_purkinje:
        synapses:
        - delay: 5.0
          model: static_synapse
          receptor_type: 1
          weight: 0.14
      parallel_fiber_to_basket:
        synapses:
        - delay: 5.0
          model: static_synapse
          receptor_type: 1
          weight: 0.06
      parallel_fiber_to_stellate:
        synapses:
        - delay: 5.0
          model: static_synapse
          receptor_type: 1
          weight: 0.08
      basket_to_purkinje:
        synapses:
        - delay: 4.0
          model: static_synapse
          receptor_type: 2
          weight: 0.8
      stellate_to_purkinje:
        synapses:
        - delay: 5.0
          model: static_synapse
          receptor_type: 2
          weight: 0.17
      basket_to_basket:
        synapses:
        - delay: 4.0
          model: static_synapse
          receptor_type: 2
          weight: 0.006
      stellate_to_stellate:
        synapses:
        - delay: 4.0
          model: static_synapse
          receptor_type: 2
          weight: 0.005
    devices:
      background_noise:
        delay: 0.1
        device: poisson_generator
        rate: 4.0
        targetting:
          cell_models:
          - mossy_fibers
          strategy: cell_model
        weight: 1.0
      mossy_fibers_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
          - mossy_fibers
          strategy: cell_model
      glomerulus_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
          - glomerulus
          strategy: cell_model
      granule_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
          - granule_cell
          strategy: cell_model
      golgi_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
          - golgi_cell
          strategy: cell_model
      purkinje_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
          - purkinje_cell
          strategy: cell_model
      basket_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
          - basket_cell
          strategy: cell_model
      stellate_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
          - stellate_cell
          strategy: cell_model
packages:
- cerebellar-models[nest]~=0.11.0
- bsb~=7.0
- bsb-nest~=7.0
