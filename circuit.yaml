name: DBBS Mouse cerebellum configuration v4.2
storage:
  engine: hdf5
  root: mouse_cerebellum.hdf5
network:
  chunk_size:
  - 100.0
  - 100.0
  - 100.0
  x: 300.0
  y: 200.0
  z: 295.0
components:
- module: cerebellar_models/nest_models/build_models.py
morphologies:
- file: ./morphologies/GranuleCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - axon
      - axon_hillock
      '17':
      - axon
      - axon_initial_segment
      '18':
      - axon
      - ascending_axon
      '19':
      - axon
      - parallel_fiber
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- file: ./morphologies/GolgiCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - dendrites
      - basal_dendrites
      '17':
      - dendrites
      - apical_dendrites
      '18':
      - axon
      - axon_initial_segment
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- file: ./morphologies/PurkinjeCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - axon
      - AIS
      '17':
      - axon
      - AIS_K
      '18':
      - axon
      - axonmyelin
      '19':
      - axon
      - nodes
      '20':
      - dendrites
      - basal
      '21':
      - dendrites
      - pf_targets
      - sc_targets
      '22':
      - dendrites
      - aa_targets
      - sc_targets
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- file: ./morphologies/StellateCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - dendrites
      - proximal_dendrites
      '17':
      - dendrites
      - distal_dendrites
      '18':
      - axon
      - axon_initial_segment
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- file: ./morphologies/BasketCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - axon
      - axon_initial_segment
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
regions:
  cerebellar_cortex:
    children:
    - granular_layer
    - purkinje_layer
    - b_molecular_layer
    - t_molecular_layer
    type: stack
partitions:
  granular_layer:
    thickness: 130.0
  purkinje_layer:
    thickness: 15.0
  b_molecular_layer:
    thickness: 50.0
  t_molecular_layer:
    thickness: 100.0
cell_types:
  glomerulus:
    plotting:
      display_name: Glomerulus
    spatial:
      density: 0.0003
      radius: 1.5
  mossy_fibers:
    spatial:
      count_ratio: 0.05
      radius: 1.0
      relative_to: glomerulus
  granule_cell:
    plotting:
      display_name: Granule cell
      opacity: 0.3
    spatial:
      density: 0.0039
      morphologies:
      - GranuleCell
      radius: 2.5
  golgi_cell:
    plotting:
      display_name: Golgi cell
    spatial:
      density: 9.0e-06
      morphologies:
      - GolgiCell
      radius: 8.0
  purkinje_cell:
    plotting:
      display_name: Purkinje cell
    spatial:
      morphologies:
      - PurkinjeCell
      planar_density: 0.001166
      radius: 7.5
  basket_cell:
    plotting:
      display_name: Basket cell
    spatial:
      density: 5.0e-05
      morphologies:
      - BasketCell
      radius: 6.0
  stellate_cell:
    plotting:
      display_name: Stellate cell
    spatial:
      density: 5.0e-05
      morphologies:
      - StellateCell
      radius: 4.0
placement:
  granular_layer_innervation:
    cell_types:
    - mossy_fibers
    partitions:
    - granular_layer
    strategy: bsb.placement.RandomPlacement
  granular_layer_placement:
    cell_types:
    - granule_cell
    - golgi_cell
    - glomerulus
    partitions:
    - granular_layer
    strategy: bsb.placement.RandomPlacement
  purkinje_layer_placement:
    angle: 80.0
    cell_types:
    - purkinje_cell
    partitions:
    - purkinje_layer
    spacing_x: 130.0
    strategy: bsb.placement.ParallelArrayPlacement
  basket_layer_placement:
    cell_types:
    - basket_cell
    partitions:
    - b_molecular_layer
    strategy: bsb.placement.RandomPlacement
  stellate_layer_placement:
    cell_types:
    - stellate_cell
    partitions:
    - t_molecular_layer
    strategy: bsb.placement.RandomPlacement
connectivity:
  mossy_fibers_to_glomerulus:
    postsynaptic:
      cell_types:
      - glomerulus
    presynaptic:
      cell_types:
      - mossy_fibers
    strategy: cerebellar_models.connectome.to_glomerulus.ConnectomeMossyGlomerulus
    x_length: 60.0
    y_length: 20.0
  glomerulus_to_granule:
    convergence: 4.0
    postsynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - dendrites
    pre_cell_types:
    - mossy_fibers
    pre_glom_strats:
    - mossy_fibers_to_glomerulus
    presynaptic:
      cell_types:
      - glomerulus
    radius: 40
    strategy: cerebellar_models.connectome.glomerulus_granule.ConnectomeGlomerulusGranule
  glomerulus_to_golgi:
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - glomerulus
    radius: 50
    strategy: cerebellar_models.connectome.glomerulus_golgi.ConnectomeGlomerulusGolgi
  golgi_to_glomerulus:
    divergence: 40.0
    glom_cell_types:
    - glomerulus
    glom_post_strats:
    - glomerulus_to_granule
    postsynaptic:
      cell_types:
      - granule_cell
    presynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - axon
    radius: 150.0
    strategy: cerebellar_models.connectome.golgi_glomerulus.ConnectomeGolgiGlomerulus
  gap_goc:
    affinity: 0.3
    contacts:
      distribution: norm
      loc: 3
      scale: 1
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  golgi_to_golgi:
    affinity: 0.5
    contacts:
      distribution: norm
      loc: 160
      scale: 5
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  ascending_axon_to_golgi:
    affinity: 0.05
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - ascending_axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  parallel_fiber_to_golgi:
    affinity: 0.08
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - apical_dendrites
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - parallel_fiber
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  ascending_axon_to_purkinje:
    affinity: 0.05
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - aa_targets
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - ascending_axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  parallel_fiber_to_purkinje:
    affinity: 0.1
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - pf_targets
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - parallel_fiber
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  parallel_fiber_to_basket:
    affinity: 0.08
    postsynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - dendrites
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - parallel_fiber
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  parallel_fiber_to_stellate:
    affinity: 0.08
    postsynaptic:
      cell_types:
      - stellate_cell
      morphology_labels:
      - dendrites
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - parallel_fiber
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  basket_to_purkinje:
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - soma
    presynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  stellate_to_purkinje:
    affinity: 0.1
    contacts:
      distribution: norm
      loc: 10
      scale: 0.3
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - sc_targets
    presynaptic:
      cell_types:
      - stellate_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  basket_to_basket:
    affinity: 0.5
    contacts:
      distribution: norm
      loc: 100
      scale: 4
    postsynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - dendrites
    presynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  stellate_to_stellate:
    affinity: 0.3
    contacts:
      distribution: norm
      loc: 100
      scale: 4
    postsynaptic:
      cell_types:
      - stellate_cell
      morphology_labels:
      - dendrites
    presynaptic:
      cell_types:
      - stellate_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
