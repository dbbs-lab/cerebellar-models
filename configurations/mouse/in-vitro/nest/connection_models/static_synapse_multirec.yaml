simulations:
  basal_activity:
    connection_models:
      gap_goc:
        synapses:
          - model: gap_junction
            weight:  14.3
        rule: one_to_one
        make_symmetric: True
      ascending_axon_to_golgi:
        synapses:
          - model: static_synapse
            receptor_type: 4
            weight: 0.59
            delay: 0.1
          - model: static_synapse
            receptor_type: 2
            weight: 0.59
            delay: 1. # ms (Presynaptic vesicles release timing)
      ascending_axon_to_purkinje:
        synapses:
          - model: static_synapse
            delay: 1.
            receptor_type: 1
            weight: 0.75
      basket_to_basket:
        synapses:
          - model: static_synapse
            receptor_type: 3
            weight: 0.016
            delay: 1.
      basket_to_purkinje:
        synapses:
          - model: static_synapse
            receptor_type: 3
            weight: 0.47
            delay: 1.
      glomerulus_to_golgi:
