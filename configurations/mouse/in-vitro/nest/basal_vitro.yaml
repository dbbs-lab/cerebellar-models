packages:
  - cerebellar-models~=0.10.0
  - bsb~=7.0
  - bsb-nest~=7.0
components:
  - cerebellar_models/nest_models/build_models.py
simulations:
  basal_activity:
    simulator: nest
    resolution: 0.1
    duration: 5000
    seed: 1234
    cell_models:
      mossy_fibers:
        model: parrot_neuron
      glomerulus:
        model: parrot_neuron
    devices:
      background_noise:
        device: poisson_generator
        rate: 4
        targetting:
          strategy: cell_model
          cell_models:
            - mossy_fibers
        weight: 1
        delay: 0.1
      mossy_fibers_record:
        device: spike_recorder
        delay: 0.1
        targetting:
          strategy: cell_model
          cell_models:
            - mossy_fibers
      glomerulus_record:
        device: spike_recorder
        delay: 0.1
        targetting:
          strategy: cell_model
          cell_models:
            - glomerulus
      basket_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
            - basket_cell
          strategy: cell_model
      golgi_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
            - golgi_cell
          strategy: cell_model
      granule_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
            - granule_cell
          strategy: cell_model
      purkinje_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
            - purkinje_cell
          strategy: cell_model
      stellate_record:
        delay: 0.1
        device: spike_recorder
        targetting:
          cell_models:
            - stellate_cell
          strategy: cell_model
      ubc_glomerulus_record:
        device: spike_recorder
        delay: 0.1
        targetting:
          strategy: cell_model
          cell_models:
            - glomerulus
      unipolar_brush_record:
        device: spike_recorder
        delay: 0.1
        targetting:
          strategy: cell_model
          cell_models:
            - unipolar_brush_cell
      dcn_p_record:
        device: spike_recorder
        delay: 0.1
        targetting:
          strategy: cell_model
          cell_models:
            - dcn_p
      dcn_i_record:
        device: spike_recorder
        delay: 0.1
        targetting:
          strategy: cell_model
          cell_models:
            - dcn_i
      io_record:
        device: spike_recorder
        delay: 0.1
        targetting:
          strategy: cell_model
          cell_models:
            - io
