    postsynaptic:
      cell_types:
      - dcn_p
      labels:
      - plus
    presynaptic:
      cell_types:
      - purkinje_cell
      labels:
      - plus
      morphology_labels:
      - axon
    strategy: bsb.connectivity.FixedOutdegree
  purkinje_to_dcn_p_minus:
    outdegree: 45
    postsynaptic:
      cell_types:
      - dcn_p
      labels:
      - minus
    presynaptic:
      cell_types:
      - purkinje_cell
      labels:
      - minus
      morphology_labels:
      - axon
    strategy: bsb.connectivity.FixedOutdegree
  purkinje_to_dcn_i_plus:
    outdegree: 12
    postsynaptic:
      cell_types:
      - dcn_i
      labels:
      - plus
    presynaptic:
      cell_types:
