      21:
        - dendrites
        - pf_targets
        - sc_targets
      22:
        - dendrites
        - aa_targets
        - sc_targets
- name: PurkinjeCell5
  file: ./morphologies/PurkinjeCell/Degeneration5/PurkinjeCell10%_dci_deg.swc
