  io_to_dcn_p_minus:
    outdegree: 30
    postsynaptic:
      cell_types:
      - dcn_p
      labels:
      - minus
    presynaptic:
      cell_types:
      - io
      labels:
      - minus
    strategy: bsb.connectivity.FixedOutdegree
  io_to_dcn_i_plus:
    outdegree: 16
    postsynaptic:
      cell_types:
      - dcn_i
      labels:
      - plus
    presynaptic:
      cell_types:
      - io
      labels:
      - plus
    strategy: bsb.connectivity.FixedOutdegree
  io_to_dcn_i_minus:
    outdegree: 16
    postsynaptic:
      cell_types:
      - dcn_i
      labels:
      - minus
    presynaptic:
      cell_types:
      - io
      labels:
      - minus
    strategy: bsb.connectivity.FixedOutdegree
  dcn_i_to_io_plus:
    indegree: 16
    postsynaptic:
      cell_types:
      - io
      labels:
      - plus
    presynaptic:
      cell_types:
      - dcn_i
      labels:
      - plus
    strategy: bsb.connectivity.FixedIndegree
  dcn_i_to_io_minus:
    indegree: 16
    postsynaptic:
      cell_types:
      - io
      labels:
      - minus
    presynaptic:
      cell_types:
      - dcn_i
      labels:
      - minus
    strategy: bsb.connectivity.FixedIndegree
after_connectivity:
  duplicate_conn_io_pc_plus:
    conn_strategy: io_to_purkinje_plus
    contacts:
      distribution: norm
      loc: 500
      scale: 5
    strategy: cerebellar_models.connectome.io_purkinje.DuplicateSynapses
