name: DBBS Mouse cerebellum configuration v4.2
storage:
  engine: hdf5
  root: mouse_cerebellum_microzones_ataxia.hdf5
network:
  chunk_size:
  - 100.0
  - 100.0
  - 100.0
  x: 300.0
  y: 200.0
  z: 695.0
components:
- module: cerebellar_models/nest_models/build_models.py
morphologies:
- file: ./morphologies/GranuleCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - axon
      - axon_hillock
      '17':
      - axon
      - axon_initial_segment
      '18':
      - axon
      - ascending_axon
      '19':
      - axon
      - parallel_fiber
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- file: ./morphologies/GolgiCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - dendrites
      - basal_dendrites
      '17':
      - dendrites
      - apical_dendrites
      '18':
      - axon
      - axon_initial_segment
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- name: PurkinjeCell1
  file: ./morphologies/PurkinjeCell/Degeneration1/PurkinjeCell10%_dci_deg.swc
  pipeline:
    - func: swap_axes
      axis1: 1
      axis2: 2
  parser:
    tags:
      16:
        - axon
        - AIS
      17:
        - axon
        - AIS_K
      18:
        - axon
        - axonmyelin
      19:
        - axon
        - nodes
      20:
        - dendrites
        - basal
      21:
        - dendrites
        - pf_targets
        - sc_targets
      22:
        - dendrites
        - aa_targets
        - sc_targets
- name: PurkinjeCell2
  file: ./morphologies/PurkinjeCell/Degeneration2/PurkinjeCell10%_dci_deg.swc
  pipeline:
    - func: swap_axes
      axis1: 1
      axis2: 2
  parser:
    tags:
      16:
        - axon
        - AIS
      17:
        - axon
        - AIS_K
      18:
        - axon
        - axonmyelin
      19:
        - axon
        - nodes
      20:
        - dendrites
        - basal
      21:
        - dendrites
        - pf_targets
        - sc_targets
      22:
        - dendrites
        - aa_targets
        - sc_targets
- name: PurkinjeCell3
  file: ./morphologies/PurkinjeCell/Degeneration3/PurkinjeCell10%_dci_deg.swc
  pipeline:
    - func: swap_axes
      axis1: 1
      axis2: 2
  parser:
