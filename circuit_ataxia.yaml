- file: ./morphologies/StellateCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - dendrites
      - proximal_dendrites
      '17':
      - dendrites
      - distal_dendrites
      '18':
      - axon
      - axon_initial_segment
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
- file: ./morphologies/BasketCell.swc
  parser:
    skip_boundary_labels:
    - soma
    tags:
      '16':
      - axon
      - axon_initial_segment
  pipeline:
  - axis1: 1
    axis2: 2
    func: swap_axes
regions:
  cerebellar_cortex:
    children:
    - granular_layer
    - purkinje_layer
    - b_molecular_layer
    - t_molecular_layer
    type: stack
  cerebellar_nuclei:
    children:
    - dcn_layer
    type: group
  inferior_olivary:
    children:
    - io_layer
    type: group
partitions:
  granular_layer:
    origin:
    - 0.0
    - 0.0
    - 300.0
    thickness: 130.0
  purkinje_layer:
    thickness: 15.0
  b_molecular_layer:
    thickness: 50.0
  t_molecular_layer:
    thickness: 100.0
  dcn_layer:
    origin:
    - 0.0
    - 0.0
    - 100.0
    thickness: 200.0
  io_layer:
    thickness: 100.0
cell_types:
  glomerulus:
    plotting:
      display_name: Glomerulus
    spatial:
      density: 0.0003
      radius: 1.5
  mossy_fibers:
    spatial:
      count_ratio: 0.05
      radius: 1.0
      relative_to: glomerulus
  granule_cell:
    plotting:
      display_name: Granule cell
      opacity: 0.3
    spatial:
      density: 0.0039
      morphologies:
      - GranuleCell
      radius: 2.5
  golgi_cell:
    plotting:
      display_name: Golgi cell
    spatial:
      density: 9.0e-06
      morphologies:
      - GolgiCell
      radius: 8.0
  purkinje_cell:
    plotting:
      display_name: Purkinje cell
    spatial:
      morphologies:
      - PurkinjeCell1
      - PurkinjeCell2
      - PurkinjeCell3
      - PurkinjeCell4
      - PurkinjeCell5
      - PurkinjeCell6
      planar_density: 0.000583 # 50% original density
      radius: 7.5
  basket_cell:
    plotting:
      display_name: Basket cell
    spatial:
      density: 5.0e-05
      morphologies:
      - BasketCell
      radius: 6.0
  stellate_cell:
    plotting:
      display_name: Stellate cell
    spatial:
      density: 5.0e-05
      morphologies:
      - StellateCell
      radius: 4.0
  dcn_p:
    plotting:
      display_name: Deep Cerebellar Nuclei type p
    spatial:
      density: 9.92e-06
      radius: 9.5
  dcn_i:
    plotting:
      display_name: Deep Cerebellar Nuclei type i
    spatial:
      density: 5.58e-06
      radius: 7.0
  io:
    plotting:
      display_name: Inferior olivary cells
    spatial:
      count_ratio: 0.2
      radius: 7.5
      relative_to: purkinje_cell
placement:
  granular_layer_innervation:
    cell_types:
    - mossy_fibers
    partitions:
    - granular_layer
    strategy: bsb.placement.RandomPlacement
  granular_layer_placement:
    cell_types:
    - granule_cell
    - golgi_cell
    - glomerulus
    partitions:
    - granular_layer
    strategy: bsb.placement.RandomPlacement
  purkinje_layer_placement:
    angle: 80.0
    cell_types:
    - purkinje_cell
    partitions:
    - purkinje_layer
    spacing_x: 130.0
    strategy: bsb.placement.ParallelArrayPlacement
  basket_layer_placement:
    cell_types:
    - basket_cell
    partitions:
    - b_molecular_layer
    strategy: bsb.placement.RandomPlacement
  stellate_layer_placement:
    cell_types:
    - stellate_cell
    partitions:
    - t_molecular_layer
    strategy: bsb.placement.RandomPlacement
  dcn_p_layer_placement:
    cell_types:
    - dcn_p
    partitions:
    - dcn_layer
    strategy: bsb.placement.RandomPlacement
  dcn_i_layer_placement:
    cell_types:
    - dcn_i
    partitions:
    - dcn_layer
    strategy: bsb.placement.RandomPlacement
  io_layer_placement:
    cell_types:
    - io
    partitions:
    - io_layer
    strategy: bsb.placement.RandomPlacement
after_placement:
  label_microzones:
    cell_types:
    - purkinje_cell
    - dcn_p
    - dcn_i
    - io
    labels:
    - plus
    - minus
    strategy: cerebellar_models.placement.microzones.LabelCells
    same_size: true
connectivity:
  mossy_fibers_to_glomerulus:
    postsynaptic:
      cell_types:
      - glomerulus
    presynaptic:
      cell_types:
      - mossy_fibers
    strategy: cerebellar_models.connectome.to_glomerulus.ConnectomeMossyGlomerulus
    x_length: 60.0
    y_length: 20.0
  glomerulus_to_granule:
    convergence: 4.0
    postsynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - dendrites
    pre_cell_types:
    - mossy_fibers
    pre_glom_strats:
    - mossy_fibers_to_glomerulus
    presynaptic:
      cell_types:
      - glomerulus
    radius: 40
    strategy: cerebellar_models.connectome.glomerulus_granule.ConnectomeGlomerulusGranule
  glomerulus_to_golgi:
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - glomerulus
    radius: 50
    strategy: cerebellar_models.connectome.glomerulus_golgi.ConnectomeGlomerulusGolgi
  golgi_to_glomerulus:
    divergence: 40.0
    glom_cell_types:
    - glomerulus
    glom_post_strats:
    - glomerulus_to_granule
    postsynaptic:
      cell_types:
      - granule_cell
    presynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - axon
    radius: 150.0
    strategy: cerebellar_models.connectome.golgi_glomerulus.ConnectomeGolgiGlomerulus
  gap_goc:
    affinity: 0.3
    contacts:
      distribution: norm
      loc: 3
      scale: 1
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  golgi_to_golgi:
    affinity: 0.5
    contacts:
      distribution: norm
      loc: 160
      scale: 5
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  ascending_axon_to_golgi:
    affinity: 0.05
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - basal_dendrites
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - ascending_axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  parallel_fiber_to_golgi:
    affinity: 0.08
    postsynaptic:
      cell_types:
      - golgi_cell
      morphology_labels:
      - apical_dendrites
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - parallel_fiber
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  ascending_axon_to_purkinje_plus:
    affinity: 0.25
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - aa_targets
      labels:
      - plus
    presynaptic:
      cell_types:
      - granule_cell
      morphology_labels:
      - ascending_axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 25000
    voxels_pre: 5000
  ascending_axon_to_purkinje_minus:
    affinity: 0.25
    postsynaptic:
      cell_types:
        - purkinje_cell
      morphology_labels:
        - aa_targets
      labels:
        - minus
    presynaptic:
      cell_types:
        - granule_cell
      morphology_labels:
        - ascending_axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 25000
    voxels_pre: 5000
  parallel_fiber_to_purkinje_plus:
    affinity: 0.215
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - pf_targets
