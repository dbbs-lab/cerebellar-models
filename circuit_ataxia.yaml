      morphology_labels:
        - sc_targets
      labels:
        - minus
    presynaptic:
      cell_types:
        - stellate_cell
      morphology_labels:
        - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 25000
    voxels_pre: 5000
  basket_to_basket:
    affinity: 0.5
    contacts:
      distribution: norm
      loc: 100
      scale: 4
    postsynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - dendrites
    presynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  stellate_to_stellate:
    affinity: 0.3
    contacts:
      distribution: norm
      loc: 100
      scale: 4
    postsynaptic:
      cell_types:
      - stellate_cell
      morphology_labels:
      - dendrites
    presynaptic:
      cell_types:
      - stellate_cell
      morphology_labels:
