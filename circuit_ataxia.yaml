      - granule_cell
      morphology_labels:
      - parallel_fiber
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 500
    voxels_pre: 500
  basket_to_purkinje_plus:
    postsynaptic:
      cell_types:
      - purkinje_cell
      morphology_labels:
      - soma
      labels:
      - plus
    presynaptic:
      cell_types:
      - basket_cell
      morphology_labels:
      - axon
    strategy: bsb.connectivity.VoxelIntersection
    voxels_post: 5000
    voxels_pre: 500
  basket_to_purkinje_minus:
    postsynaptic:
