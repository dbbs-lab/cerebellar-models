    presynaptic:
      cell_types:
      - io
      labels:
      - minus
    strategy: bsb.connectivity.FixedIndegree
  io_to_mli_plus:
    io_pc_connectivity:
    - io_to_purkinje_plus
    mli_pc_connectivity:
    - basket_to_purkinje_plus
    - stellate_to_purkinje_plus
    postsynaptic:
      cell_types:
      - basket_cell
      - stellate_cell
    pre_cell_pc:
      cell_types:
      - purkinje_cell
      labels:
      - plus
    presynaptic:
