      19:
        - axon
        - nodes
      20:
        - dendrites
        - basal
      21:
        - dendrites
        - pf_targets
        - sc_targets
      22:
        - dendrites
        - aa_targets
        - sc_targets
- name: PurkinjeCell4
  file: ./morphologies/PurkinjeCell/Degeneration4/PurkinjeCell10%_dci_deg.swc
  pipeline:
    - func: swap_axes
      axis1: 1
